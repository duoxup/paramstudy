[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paramstudy"
version = "0.1.0"
description = "DataFrame-based tools for parameter studies and scan visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Duo Xu", email = "duoxup@example.com" }]
license = { text = "MIT" }
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["paramstudy*"]

[tool.setuptools.package-data]
"paramstudy" = ["py.typed"]

[tool.ruff]
line-length = 100
